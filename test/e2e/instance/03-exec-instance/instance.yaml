apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: e2e-exec-instance
  annotations:
    # Opts this Instance into kubectl exec; kraftlet attaches the sandbox plugin.
    cloud.unikraft.v1.instances/enable-exec: "true"
    # Keep the guest awake for the whole test (see 02-run-instance/instance.yaml).
    cloud.unikraft.v1.instances/scale_to_zero.policy: "on"
    cloud.unikraft.v1.instances/scale_to_zero.stateful: "true"
    cloud.unikraft.v1.instances/scale_to_zero.cooldown_time_ms: "600000"
spec:
  runtime:
    resources:
      instanceType: datumcloud/d1-standard-2
    sandbox:
      containers:
        - name: app
          image: datum/httpserver-go121:latest
          ports:
            - name: http
              port: 8080
              protocol: TCP
          resources:
            limits:
              memory: 256Mi
  networkInterfaces:
    - network:
        name: default
