# Names the published InstanceType (instance-type.yaml) and sets no container
# resources, so the Pod's limits can only come from that object.
apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: e2e-published-type-instance
spec:
  runtime:
    resources:
      instanceType: e2e-custom-2cpu-1gi
    sandbox:
      containers:
        - name: app
          image: datum/bun@sha256:13a3b306652d78df4230d57ca2404dc62788c6c9265e11d76d8f3bc05d1a4efc
          ports:
            - name: http
              port: 3000
              protocol: TCP
  networkInterfaces:
    - network:
        name: default
