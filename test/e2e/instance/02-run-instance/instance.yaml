apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: e2e-run-instance
spec:
  runtime:
    resources:
      instanceType: datumcloud/d1-standard-2
    sandbox:
      containers:
        - name: app
          image: datum/httpserver-go121:latest
          ports:
            - name: http
              port: 8080
              protocol: TCP
          resources:
            limits:
              memory: 256Mi
  networkInterfaces:
    - network:
        name: default
