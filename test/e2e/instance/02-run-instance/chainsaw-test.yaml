apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: run-instance
spec:
  # Unlike 01-create-instance (which only asserts the provider translates an
  # Instance into a scheduled Pod, and so passes against the e2e-fake metro),
  # this test exercises the compute API to actually START an instance and
  # asserts it reaches a running microVM. It therefore requires a real
  # Unikraft runtime behind Kraftlet (e.g. the containerized runtime from
  # docs/enhancements/containerized-unikraft-runtime).
  # We assert the instance reaches Available (its microVM has booted on the
  # runtime) and that its microVM Pod is Running on the runtime node — but
  # NOT that the guest is reachable over the network. In-guest reachability
  # additionally requires the network programming done by the Galactic
  # networking operator, which is out of scope for this runtime-focused test
  # and not deployed here.
  description: Start an Instance through the compute API and assert it runs.
  steps:
    # state-projector's billing "project" comes from a label on the Namespace
    # object (meta.datumapis.com/upstream-cluster-name), never the namespace's
    # own name — see cmd/state-projector/README.md "Attribution". In a real
    # cluster this is stamped by Karmada federation before any Instance can
    # exist in the namespace; this kind sandbox has no such federation, so
    # stamp it ourselves to exercise the real decode path end-to-end rather
    # than only ever hitting the unresolved ("-") fallback.
    - name: label the test namespace with a Karmada-style project identity
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ($namespace)
                labels:
                  meta.datumapis.com/upstream-cluster-name: cluster-e2e-test-project
    - name: create and start the Instance
      try:
        - apply:
            file: instance.yaml
        - assert:
            resource:
              apiVersion: compute.datumapis.com/v1alpha
              kind: Instance
              metadata:
                name: e2e-run-instance
              status:
                # Subset match: assert the Available condition is True without
                # requiring the full condition list to match exactly.
                (conditions[?type == 'Available'] | [0].status): "True"
    - name: assert the microVM is running on the runtime node
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  managed-by: infra-provider-unikraft
                  upstream.instance: e2e-run-instance
              status:
                phase: Running
    # state-projector is the runtime-side half of per-second usage billing
    # (cmd/state-projector/README.md): it watches this same instance's
    # vm.state_change stream and should have attributed a windowed usage
    # record to this test's namespace by now. Nothing above exercises that
    # path — the Instance/Pod asserts only prove the VM booted. The e2e
    # overlay shortens state-projector's flush interval to 10s (production
    # stays at 5m) specifically so this can assert within a normal timeout
    # instead of needing to wait for a flush or stop the instance.
    - name: assert state-projector attributed a usage record to this instance
      try:
        - script:
            timeout: 90s
            env:
              # The decoded project id, NOT the namespace — state-projector
              # resolves this from the namespace's upstream-cluster-name label
              # (stamped by the earlier step), not from $namespace itself. Using
              # the namespace here would silently reintroduce the bug this test
              # exists to catch.
              - name: PROJECT
                value: e2e-test-project
            content: |
              set -eu
              POD=$(kubectl -n unikraft-system get pod -l app=ukp-runtime -o jsonpath='{.items[0].metadata.name}')
              # Kept for visibility into the uuid -> Pod resolution path
              # (containerIDs()/resolve() in cmd/state-projector/main.go):
              # Kraftlet sets each provider Pod container's status.containerID
              # to the ukpd instance uuid itself, which is what attribution
              # joins on — useful ground truth if that ever regresses again.
              # This instance can be extremely short-lived (observed ~1.4s), so
              # the Pod may already be gone by the time this runs — `|| true`
              # on both so a diagnostic-only miss never aborts the script under
              # `set -e` before the actual polling loop below gets a chance.
              echo "--- provider Pod containerID for this instance ---"
              kubectl get pod -l upstream.instance=e2e-run-instance \
                -o jsonpath='{.items[0].status.containerStatuses[*].containerID}{"\n"}' 2>&1 || true
              echo "--- ukpd's own per-instance workspace dirs on the node ---"
              kubectl -n unikraft-system exec "$POD" -c ukpd -- \
                ls /var/lib/ukp/data/platform/ 2>&1 || true
              for i in $(seq 1 40); do
                POD=$(kubectl -n unikraft-system get pod -l app=ukp-runtime -o jsonpath='{.items[0].metadata.name}')
                # -c ukpd, not state-projector: state-projector runs on
                # distroless/static (no shell, no grep/cat at all) — ukpd
                # shares the same ukp-run volume and has a real userland.
                if kubectl -n unikraft-system exec "$POD" -c ukpd -- \
                     grep -q "\"project\":\"$PROJECT\".*\"instance\":\"e2e-run-instance\"" \
                     /var/run/ukp/vm-state.usage; then
                  echo "found a usage record for $PROJECT/e2e-run-instance"
                  exit 0
                fi
                sleep 2
              done
              echo "no usage record for $PROJECT/e2e-run-instance after ~80s" >&2
              kubectl -n unikraft-system exec "$POD" -c ukpd -- \
                cat /var/run/ukp/vm-state.usage >&2 2>&1 || true
              exit 1
    # Last leg of per-second billing. state-projector writes one JSON line per
    # windowed usage record to vm-state.usage; Vector (config/overlays/vector-e2e)
    # tails that file and turns each record into TWO billing CloudEvents — a
    # cpu-seconds event and a memory-seconds event, per the production NSO
    # per-metric convention — then POSTs them to the mock billing gateway.
    #
    # The step above only proves state-projector WROTE the record; this step
    # proves Vector shipped it correctly. Rather than trust Vector's arithmetic
    # (or hardcode numbers, which would drift with window timing), we recompute
    # the expected values ourselves from the SAME record and check the events:
    #     vcpu_seconds       = record.vcpu                * record.duration_s
    #     memory_gib_seconds = (record.memory_bytes / 2^30) * record.duration_s
    # (the exact products the VRL transform computes). We assert the gateway
    # received, for that record, both events whose data.value equals these — so a
    # match proves Vector computed the same result from the same input, end to
    # end from state-projector's file to the billing consumer.
    - name: assert Vector shipped vCPU and memory usage billing CloudEvents to the mock gateway
      try:
        - script:
            timeout: 120s
            env:
              - name: PROJECT
                value: e2e-test-project
              - name: INSTANCE
                value: e2e-run-instance
            content: |
              set -eu
              DEADLINE=$(($(date +%s) + 100))
              while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                POD=$(kubectl -n unikraft-system get pod -l app=ukp-runtime -o jsonpath='{.items[0].metadata.name}')
                # state-projector runs on distroless/static (no shell); ukpd
                # shares the same ukp-run volume and has a real userland.
                USAGE=$(kubectl -n unikraft-system exec "$POD" -c ukpd -- \
                  cat /var/run/ukp/vm-state.usage 2>/dev/null || true)
                MOCK_LOGS=$(kubectl -n unikraft-system logs -l app=mock-billing-gateway --tail=200 2>/dev/null || true)
                if [ -z "$USAGE" ] || [ -z "$MOCK_LOGS" ]; then
                  sleep 5
                  continue
                fi
                # Verified with the same dedent pattern as the NSO billing e2e
                # (python passed via -c + textwrap.dedent, so an indented block
                # scalar here can't break an inline heredoc delimiter).
                # Receives the usage records on stdin; mock-gateway logs +
                # project/instance on argv. Exits 0 once the gateway has a
                # CloudEvents whose values reproduce a real usage record.
                PYTHON_VERIFY="
                import sys, json
                usage_txt = sys.stdin.read()
                logs_txt, project, instance = sys.argv[2], sys.argv[3], sys.argv[4]

                # Expected values, per usage record id, from vm-state.usage.
                expected = {}
                for line in usage_txt.splitlines():
                    line = line.strip()
                    if not line:
                        continue
                    try:
                        r = json.loads(line)
                    except Exception:
                        continue
                    if r.get('instance') != instance or r.get('project') != project:
                        continue
                    dur = float(r.get('duration_s') or 0)
                    expected[r.get('id')] = {
                        'vcpu_seconds': float(r.get('vcpu') or 0) * dur,
                        # Billed in GiB-seconds like the VRL transform: bytes -> GiB
                        # (divide by 2^30) before scaling by duration.
                        'memory_gib_seconds': (float(r.get('memory_bytes') or 0) / 1073741824.0) * dur,
                    }
                if not expected:
                    raise SystemExit(1)

                # Collect billing CloudEvents from the mock gateway's logs. The
                # mock gateway prints one request body per log line; Vector's
                # http sink may batch as a JSON array or as NDJSON, so accept
                # either a single object, a line array, or one object per line.
                events = []
                for line in logs_txt.splitlines():
                    line = line.strip()
                    if not line:
                        continue
                    try:
                        obj = json.loads(line)
                    except Exception:
                        continue
                    if isinstance(obj, list):
                        events.extend(obj)
                    elif isinstance(obj, dict) and 'type' in obj:
                        events.append(obj)

                # Like the production NSO billing collector, each usage record
                # maps to TWO CloudEvents — one cpu-seconds and one
                # memory-seconds — with per-type ids (record id + '-vcpu' /
                # '-mem'). Verify one usage record has BOTH events present, each
                # reproducing its metric from the usage record, with the right
                # project/instance dimensions.
                VCU_TYPE = 'compute.datumapis.com/instance/cpu-seconds'
                MEM_TYPE = 'compute.datumapis.com/instance/memory-seconds'
                def close(a, b):
                    return a is not None and abs(float(a) - b) <= max(1e-3, 1e-6 * abs(b))

                def ev(rid, etype):
                    for e in events:
                        if (e.get('id') == rid and e.get('type') == etype
                                and e.get('subject') == 'projects/' + project):
                            return e
                    return None

                for rid, want in expected.items():
                    vcpu = ev(rid + '-vcpu', VCU_TYPE)
                    mem = ev(rid + '-mem', MEM_TYPE)
                    if vcpu is None or mem is None:
                        continue
                    vd = vcpu.get('data') or {}
                    md = mem.get('data') or {}
                    if not close(vd.get('value'), want['vcpu_seconds']):
                        continue
                    if not close(md.get('value'), want['memory_gib_seconds']):
                        continue
                    vdim = vd.get('dimensions') or {}
                    mdim = md.get('dimensions') or {}
                    if vdim.get('project') != project or vdim.get('instance') != instance:
                        continue
                    if mdim.get('project') != project or mdim.get('instance') != instance:
                        continue
                    print('SUCCESS: usage CloudEvents id=%s vcpu_seconds=%s memory_gib_seconds=%s' % (rid, vd['value'], md['value']))
                    raise SystemExit(0)
                # Not found yet — let the shell loop retry.
                raise SystemExit(1)
                "
                if echo "$USAGE" | python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.argv[1]))" "$PYTHON_VERIFY" "$MOCK_LOGS" "$PROJECT" "$INSTANCE"; then
                  echo "SUCCESS: Vector shipped the vCPU + memory usage billing CloudEvents to the mock gateway"
                  exit 0
                fi
                sleep 5
              done
              echo "FAIL: no matching usage billing CloudEvents reached the mock gateway after ~100s" >&2
              echo "--- usage records for $PROJECT ---" >&2
              echo "$USAGE" | grep "\"instance\":\"$INSTANCE\"" >&2 2>/dev/null || true
              echo "--- mock gateway logs ---" >&2
              kubectl -n unikraft-system logs -l app=mock-billing-gateway --tail=200 >&2 2>/dev/null || true
              echo "--- vector logs ---" >&2
              kubectl -n unikraft-system logs -l app=vector --tail=50 >&2 2>/dev/null || true
              exit 1
