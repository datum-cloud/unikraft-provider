apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: run-instance
spec:
  # Unlike 01-create-instance (which only asserts the provider translates an
  # Instance into a scheduled Pod, and so passes against the e2e-fake metro),
  # this test exercises the compute API to actually START an instance and
  # asserts it reaches a running microVM. It therefore requires a real
  # Unikraft runtime behind Kraftlet (e.g. the containerized runtime from
  # docs/enhancements/containerized-unikraft-runtime).
  # We assert the instance reaches Available (its microVM has booted on the
  # runtime) and that its microVM Pod is Running on the runtime node — but
  # NOT that the guest is reachable over the network. In-guest reachability
  # additionally requires the network programming done by the Galactic
  # networking operator, which is out of scope for this runtime-focused test
  # and not deployed here.
  description: Start an Instance through the compute API and assert it runs.
  steps:
    # state-projector's billing "project" comes from a label on the Namespace
    # object (meta.datumapis.com/upstream-cluster-name), never the namespace's
    # own name — see cmd/state-projector/README.md "Attribution". In a real
    # cluster this is stamped by Karmada federation before any Instance can
    # exist in the namespace; this kind sandbox has no such federation, so
    # stamp it ourselves to exercise the real decode path end-to-end rather
    # than only ever hitting the unresolved ("-") fallback.
    - name: label the test namespace with a Karmada-style project identity
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ($namespace)
                labels:
                  meta.datumapis.com/upstream-cluster-name: cluster-e2e-test-project
    - name: create and start the Instance
      try:
        - apply:
            file: instance.yaml
        - assert:
            resource:
              apiVersion: compute.datumapis.com/v1alpha
              kind: Instance
              metadata:
                name: e2e-run-instance
              status:
                # Subset match: assert the Available condition is True without
                # requiring the full condition list to match exactly.
                (conditions[?type == 'Available'] | [0].status): "True"
    - name: assert the microVM is running on the runtime node
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                labels:
                  managed-by: infra-provider-unikraft
                  upstream.instance: e2e-run-instance
              status:
                phase: Running
    # state-projector is the runtime-side half of per-second usage billing
    # (cmd/state-projector/README.md): it watches this same instance's
    # vm.state_change stream and should have attributed a windowed usage
    # record to this test's namespace by now. Nothing above exercises that
    # path — the Instance/Pod asserts only prove the VM booted. The e2e
    # overlay shortens state-projector's flush interval to 10s (production
    # stays at 5m) specifically so this can assert within a normal timeout
    # instead of needing to wait for a flush or stop the instance.
    - name: assert state-projector attributed a usage record to this instance
      try:
        - script:
            timeout: 90s
            env:
              # The decoded project id, NOT the namespace — state-projector
              # resolves this from the namespace's upstream-cluster-name label
              # (stamped by the earlier step), not from $namespace itself. Using
              # the namespace here would silently reintroduce the bug this test
              # exists to catch.
              - name: PROJECT
                value: e2e-test-project
            content: |
              set -eu
              POD=$(kubectl -n unikraft-system get pod -l app=ukp-runtime -o jsonpath='{.items[0].metadata.name}')
              # Kept for visibility into the uuid -> guest IP resolution path
              # (guestIP() in cmd/state-projector/main.go) — useful ground truth
              # if that ever regresses again.
              echo "--- vmm.json for this instance's workspace dir(s) ---"
              kubectl -n unikraft-system exec "$POD" -c ukpd -- \
                sh -c 'for f in /var/lib/ukp/data/platform/*/vmm.json; do echo "-- $f --"; cat "$f"; echo; done' 2>&1
              for i in $(seq 1 40); do
                POD=$(kubectl -n unikraft-system get pod -l app=ukp-runtime -o jsonpath='{.items[0].metadata.name}')
                # -c ukpd, not state-projector: state-projector runs on
                # distroless/static (no shell, no grep/cat at all) — ukpd
                # shares the same ukp-run volume and has a real userland.
                if kubectl -n unikraft-system exec "$POD" -c ukpd -- \
                     grep -q "\"project\":\"$PROJECT\".*\"instance\":\"e2e-run-instance\"" \
                     /var/run/ukp/vm-state.usage; then
                  echo "found a usage record for $PROJECT/e2e-run-instance"
                  exit 0
                fi
                sleep 2
              done
              echo "no usage record for $PROJECT/e2e-run-instance after ~80s" >&2
              kubectl -n unikraft-system exec "$POD" -c ukpd -- \
                cat /var/run/ukp/vm-state.usage >&2 2>&1 || true
              exit 1
