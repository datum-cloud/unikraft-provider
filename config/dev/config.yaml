apiVersion: apiserver.config.datumapis.com/v1alpha1
kind: UnikraftProvider
metricsServer:
  bindAddress: ":8080"
  secureServing: false
webhookServer:
  port: 9443
downstreamResourceManagement:
  # NodeSelector and Tolerations are optional overrides. When unset the
  # provider defaults to: kubernetes.io/hostname=kraftlet and the
  # virtual-kubelet.io/provider=ukc:NoSchedule toleration.
  # InstanceDNS sets the resolvers every Instance uses, in place of the
  # runtime's default. Unset leaves the default in place. IPv4 and IPv6
  # literals are both accepted; Kubernetes allows at most three.
  # instanceDNS:
  #   nameservers:
  #     - "2606:4700:4700::1111"
  #     - "2001:4860:4860::8888"
  #   searches:
  #     - example.internal
locationClassName: "self-managed"
