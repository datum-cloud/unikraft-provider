# Example: Unikraft provider running in single-cell mode (Instance and Pod
# are co-located in the same cluster; no multi-cluster plumbing needed).
apiVersion: apiserver.config.datumapis.com/v1alpha1
kind: UnikraftProvider
metricsServer:
  bindAddress: "0"
  secureServing: false
downstreamResourceManagement:
locationClassName: "self-managed"
