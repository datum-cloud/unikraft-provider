apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kraftlet
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - bridge-nginx-configmap.yaml
  - certificates.yaml
  - daemonset.yaml
# TLS material (kraftlet-bridge-tls + its ca.crt) is issued by cert-manager
# (certificates.yaml). This base does NOT ship the ukpd bearer Secret
# (kraftlet-ukc-token): its source differs per environment, so an overlay
# supplies it. Deploy an overlay, not this base directly:
#   - config/overlays/kraftlet-e2e  — self-contained TEST/DEV Secret (kind e2e)
#   - config/overlays/kraftlet      — ESO mirror of the runtime-generated token
#                                     (real clusters; requires External Secrets)
