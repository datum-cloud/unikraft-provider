apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: unikraft-system
resources:
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - daemonset.yaml
# The unikraft-system namespace (privileged Pod Security) is created by the
# deploying layer, not this bundle: the datum-cloud/infra edge app owns it on
# real clusters, and test/e2e/kind/setup.sh creates it for the kind e2e.
#
# This base does NOT ship the ukpd bearer Secret (kraftlet-ukc-token): its
# source differs per environment, so an overlay supplies it. Deploy an overlay,
# not this base directly:
#   - config/overlays/kraftlet-e2e  — self-contained TEST/DEV Secret (kind e2e)
#   - config/overlays/kraftlet      — real clusters; the token is generated by
#                                     the ukp-runtime overlay in this same
#                                     namespace (single source of truth)
