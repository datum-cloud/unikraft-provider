apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: compute
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: compute
  # The e2e creates Instances directly, and compute admits only Workloads, so
  # only the API is needed here. The production overlay also pulls in
  # dependencies a single-node kind cluster cannot provide.
  path: base/crd
