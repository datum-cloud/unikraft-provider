apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: compute
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/datum-cloud/compute-kustomize
  ref:
    # Matches the compute revision this provider builds against, so the Instance
    # CRD serving the e2e declares every field the provider selects on. An API
    # server rejects a field selector naming a field its CRD does not declare
    # selectable.
    tag: v0.0.0-main-20260911-191109
