apiVersion: v1
kind: ServiceAccount
metadata:
  name: ukp-oci-adapter
  namespace: unikraft-system
---
# Claims and releases gated Pods; reads their pull Secrets to pull and to
# re-check access at every instance start.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ukp-oci-adapter
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ukp-oci-adapter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ukp-oci-adapter
subjects:
  - kind: ServiceAccount
    name: ukp-oci-adapter
    namespace: unikraft-system
