# Service account for the ukp-runtime DaemonSet. The state-projector sidecar uses
# it to watch provider Pods cluster-wide and correlate a guest IP to its project /
# instance (the provider Pods live on the Kraftlet virtual node, so node-scoping
# cannot apply).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ukp-runtime
  namespace: unikraft-system
