apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: unikraft-system
resources:
  - daemonset.yaml
# CI stamps the commit-pinned tag here at bundle-publish time; the :latest default
# keeps `kustomize build` and local e2e working (e2e overrides with ukp-runtime:e2e).
images:
  - name: ghcr.io/datum-cloud/ukp-runtime
    newTag: latest
# The runtime configuration is injected as a ConfigMap. The generated
# name carries a content hash, so config changes roll the DaemonSet.
configMapGenerator:
  - name: ukp-runtime-config
    files:
      - ukp.conf
      - log-sinks.json
