apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ukp-system
resources:
  - namespace.yaml
  - daemonset.yaml
# The runtime image tag is stamped in by CI at bundle-publish time
# (`kustomize edit set image`), so the published bundle pins the exact
# image built from the same commit instead of the mutable `:latest`. The
# `:latest` default keeps `kustomize build` and the local e2e apply working
# unchanged; e2e overrides it with its locally built ukp-runtime:e2e image.
images:
  - name: ghcr.io/datum-cloud/ukp-runtime
    newTag: latest
# The runtime configuration is injected as a ConfigMap. The generated
# name carries a content hash, so config changes roll the DaemonSet.
configMapGenerator:
  - name: ukp-runtime-config
    files:
      - ukp.conf
