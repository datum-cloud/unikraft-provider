apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: unikraft-system
resources:
  - daemonset.yaml
# The runtime configuration is injected as a ConfigMap. The generated
# name carries a content hash, so config changes roll the DaemonSet.
configMapGenerator:
  - name: ukp-runtime-config
    files:
      - ukp.conf
