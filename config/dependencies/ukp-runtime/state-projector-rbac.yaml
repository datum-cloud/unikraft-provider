# RBAC for the ukp-runtime state-projector sidecar: it watches provider Pods
# cluster-wide to map an instance's guest IP to the project namespace + instance
# name (upstream.instance label), which it records as usage attribution.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ukp-state-projector-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ukp-state-projector-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ukp-state-projector-pod-reader
subjects:
  - kind: ServiceAccount
    name: ukp-runtime
    namespace: unikraft-system
