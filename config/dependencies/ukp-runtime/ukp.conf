# Unikraft runtime configuration (minimal profile), injected as a
# ConfigMap and mounted at /etc/ukp.conf. Sourced as bash by every
# runtime launcher.
#
# Credentials do not belong in this file: they are provided by the
# optional `ukp-runtime-credentials` Secret, mounted at
# /etc/ukp-secrets/ and sourced at the end of this file.

## Global paths (match the volume mounts in daemonset.yaml)
UKP_DATA="/var/lib/ukp/data"
UKP_BACKUPS="/var/lib/ukp/backups"
UKP_VOLUMES="/var/lib/ukp/volumes"
UKP_SNAPSHOTS="/var/lib/ukp/snapshots"
UKP_IMAGES="/var/lib/ukp/images"
UKP_RUNTIME="/var/run/ukp"
UKP_USERDB="/var/lib/ukp/data/users.json"
UKP_LOGDIR="/var/log/ukp"
UKP_PROMETHEUS_API_TOKEN=""
UKP_PROMETHEUS_API_TOKEN_PRIVATE=""

# The data volume is mounted by kubelet before containers start; no
# mount barrier is needed.
UKP_CUSTOM_MPOINTS=()

## Platform daemon
UKPD_EXTRA_ARGS=()
UKPD_EXTRA_ARGS+=("--vmm-initrd-map-shared")

## Network/IP configuration
# Empty NET_IFACE: auto-detect the interface holding the default route.
NET_IFACE=""
NET_MODE="isolates"
NET_SEGMENT="172.16.0.0/12"
NET_COUNT="256"

## Naming
# Empty DNS_HOSTNAME: auto-detect from the node hostname (the pod runs
# in the host network namespace). The zones are internal naming only in
# the minimal profile — the vendor proxy/DNS stack that would expose
# them is not deployed.
DNS_HOSTNAME=""
DNS_ZONE_API="ukp.internal"
DNS_ZONE_APP="app.ukp.internal"

## Internal DNS
IDNS_HOSTNAME="ns"
IDNS_ZONE="internal"
IDNS_EMAIL="ns@internal"

## CoreDNS resolver (read by the Datum coredns-redirect entrypoint).
# The stripped vendor CoreDNS has no `bind` plugin, so it can only listen on the
# wildcard. To avoid colliding with Talos hostDNS on 127.0.0.53:53 it listens on
# UKP_DNS_PORT and an nftables rule redirects guest gateway:53 traffic to it.
UKP_DNS_PORT="5300"
# Upstream for everything outside the internal zone. Talos hostDNS by default;
# set to a public resolver (e.g. 1.1.1.1:53) on non-Talos/native hosts.
UKP_DNS_UPSTREAM="127.0.0.53:53"

## Platform agent — image pull configuration.
# Tokens come from the credentials Secret; only the pull policy lives here.
AGENT_PULL_NATS_USER=""
AGENT_PULL_NATS_TOKEN=""
# Customer images are pulled from external registries (e.g. private
# Docker Hub) using per-pod image pull secrets, so the vendor registry
# whitelist and Harbor token are disabled. IMPORTANT: the launcher
# sources this file with `set -a`, so a variable set to "" reaches the
# agent as present-but-empty while a commented-out variable is unset —
# and the agent only fully disables its pull-rule checks when BOTH are
# unset (vendor-confirmed behavior). To re-enable the whitelist,
# uncomment both and list the allowed repo namespaces (comma-separated,
# e.g. "official,<dockerhub-namespace>").
#AGENT_PULL_HARBOR_TOKEN=""
#AGENT_PULL_INCLUDE="official"
AGENT_PULL_IGNORE=""
AGENT_OTEL_ADDR=""
AGENT_OTEL_TOKEN=""

## Node quota computation (read by the seed-users initContainer in the
## ukp-runtime overlay; the launchers ignore these). The seeded platform
## user's vmm/vmdb quotas — which are exactly the capacity kraftlet
## advertises for the node — are computed per node from host resources
## at seed time: the node's full resources minus a fixed system reserve.
##   vmm.max_vcpus      = host_cpus - UKP_QUOTA_CPU_RESERVE
##   vmm.max_memory_mb  = host_mem_mb - UKP_QUOTA_MEM_RESERVE_MB
##   vmdb.max_instances = vmm.max_vcpus * UKP_QUOTA_INSTANCES_PER_VCPU
## The reserve covers ukpd, the agent, and Talos system components.
## These quotas double as platform enforcement, so the reserve is what
## keeps guests from starving the host. If computation fails — or a
## reserve meets/exceeds what the node has — seeding FAILS the pod
## rather than assuming a capacity.
UKP_QUOTA_CPU_RESERVE="4"
UKP_QUOTA_MEM_RESERVE_MB="8192"
UKP_QUOTA_INSTANCES_PER_VCPU="2"
# Per-instance bounds (vmdb): the largest single microVM a user may create.
UKP_QUOTA_VM_MAX_MEM_MB="8192"
UKP_QUOTA_VM_MAX_VCPUS="8"

## Unused in the minimal profile (no proxy/certificate stack)
CLOUDFLARE_DNS_API_TOKEN=""
CLOUDFLARE_DNS_EMAIL=""
REMOTE_PSQLD=""
LOCAL_PSQLD=""
REMOTE_SMBD=""
LOCAL_SMBD=""

# Overlay credentials (and any per-node overrides) from the optional
# `ukp-runtime-credentials` Secret. Keys in that Secret use the same
# bash syntax as this file, e.g.:
#   AGENT_PULL_NATS_USER="..."
#   AGENT_PULL_NATS_TOKEN="..."
#   AGENT_PULL_HARBOR_TOKEN="..."
# NOTE: launchers source this file under `bash -e`; the `if` form keeps
# the final status 0 when the overlay is absent.
if [ -f /etc/ukp-secrets/ukp.secrets.conf ]; then
	. /etc/ukp-secrets/ukp.secrets.conf
fi
