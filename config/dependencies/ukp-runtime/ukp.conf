# Unikraft runtime configuration (minimal profile), injected as a
# ConfigMap and mounted at /etc/ukp.conf. Sourced as bash by every
# runtime launcher.
#
# Credentials do not belong in this file: they are provided by the
# optional `ukp-runtime-credentials` Secret, mounted at
# /etc/ukp-secrets/ and sourced at the end of this file.

## Global paths (match the volume mounts in daemonset.yaml)
UKP_DATA="/var/lib/ukp/data"
UKP_BACKUPS="/var/lib/ukp/backups"
UKP_VOLUMES="/var/lib/ukp/volumes"
UKP_SNAPSHOTS="/var/lib/ukp/snapshots"
UKP_IMAGES="/var/lib/ukp/images"
UKP_RUNTIME="/var/run/ukp"
UKP_USERDB="/var/lib/ukp/data/users.json"
UKP_LOGDIR="/var/log/ukp"
UKP_PROMETHEUS_API_TOKEN=""
UKP_PROMETHEUS_API_TOKEN_PRIVATE=""

# The data volume is mounted by kubelet before containers start; no
# mount barrier is needed.
UKP_CUSTOM_MPOINTS=()

## Platform daemon
UKPD_EXTRA_ARGS=()
UKPD_EXTRA_ARGS+=("--vmm-initrd-map-shared")
# Debug (0) while validating the new vm-state-sink log sink: ukpd crash-loops
# on it with only "Failed to stat buffer file '...': ENOTDIR" at the default
# info level, and the vendor manual doesn't document where a reliable sink's
# persistent buffer file lives on disk. 
# // TODO: Revert to the default (1/info) once
# that sink is confirmed working. See cmd/state-projector/README.md.
UKPD_EXTRA_ARGS+=("--log-level" "0")
# ukpd gives this kernel to images packaged without one. The runtime image
# always ships it at this path, so it is on by default. Set UKP_KERNEL_PATH=""
# on the container to turn it off.
UKP_KERNEL_PATH="${UKP_KERNEL_PATH:-/usr/lib/ukp/kernel}"
if [ -n "$UKP_KERNEL_PATH" ]; then
	UKPD_EXTRA_ARGS+=("--images-kernel-path=${UKP_KERNEL_PATH}")
fi

## Monitoring & observability
# ukpd serves Prometheus-format metrics (/metrics/controller, /metrics/host,
# /metrics/agent). Bind the metrics API on all interfaces so a cluster
# scraper can reach it at <node-ip>:45233; require auth by setting
# UKP_PROMETHEUS_API_TOKEN (above) from the credentials Secret, and have the
# scraper send it as a Bearer token.
UKPD_EXTRA_ARGS+=("--metrics-api-endpoint" "0.0.0.0:45233")
# Emit per-VM (Firecracker) metrics into each instance's workspace directory
# — the per-instance boot/lifecycle detail needed to diagnose VMs that never
# reach 'running'.
UKPD_EXTRA_ARGS+=("--vmm-metrics-emit")
# Stream structured log + VM state-change events to container stdout as JSON
# (see log-sinks.json), so `kubectl logs` and any log aggregator observe the
# instance lifecycle. ukpd's primary file log still goes to $UKP_LOGDIR.
UKPD_EXTRA_ARGS+=("--log-sink-config" "/etc/ukp/log-sinks.json")

## Image cache authorization
# Re-authorize every image reference with the agent even when the image is
# already cached on the node: without it, one instance's pull leaves a private
# image bootable by any later credential-less instance.
UKPD_EXTRA_ARGS+=("--images-always-authorize")

## Network/IP configuration
# NET_IFACE: pin a specific interface (e.g. a bonded NIC on Talos), or leave
# empty to auto-detect the interface holding the default route. Real
# clusters pin this via the container's NET_IFACE env var (see
# config/overlays/ukp-runtime/net-iface-patch.yaml) rather than here, since
# the kind e2e cluster (config/overlays/ukp-runtime-e2e) has no bond0 and
# needs this file's default to stay auto-detect.
NET_IFACE="${NET_IFACE:-}"
NET_MODE="isolates"
NET_SEGMENT="172.16.0.0/12"
# NET_COUNT=0: the provider creates and manages TAP interfaces itself, so
# the runtime must not pre-create or manage any network devices.
NET_COUNT="0"
# ukpd holds a freed TAP name and IP before letting them be re-allocated, so
# an IP-reuse hazard can't outlive the interface. Nothing here draws from
# ukpd's pool (NET_COUNT=0 above), so the hold only stalls recreating a
# workload on its own deterministic TAP name. 1s is the shortest allowed.
UKPD_EXTRA_ARGS+=("--net-iface-retention-time-s" "1")

## Naming
# Empty DNS_HOSTNAME: auto-detect from the node hostname (the pod runs
# in the host network namespace). The zones are internal naming only in
# the minimal profile — the vendor proxy/DNS stack that would expose
# them is not deployed.
DNS_HOSTNAME=""
DNS_ZONE_API="ukp.internal"
DNS_ZONE_APP="app.ukp.internal"

## Internal DNS
IDNS_HOSTNAME="ns"
IDNS_ZONE="internal"
IDNS_EMAIL="ns@internal"

## CoreDNS resolver (read by the Datum coredns-redirect entrypoint).
# The stripped vendor CoreDNS has no `bind` plugin, so it can only listen on the
# wildcard. To avoid colliding with Talos hostDNS on 127.0.0.53:53 it listens on
# UKP_DNS_PORT and an nftables rule redirects guest gateway:53 traffic to it.
UKP_DNS_PORT="5300"
# Upstream for everything outside the internal zone. Talos hostDNS by default;
# set to a public resolver (e.g. 1.1.1.1:53) on non-Talos/native hosts.
UKP_DNS_UPSTREAM="127.0.0.53:53"

## Platform agent — image pull configuration.
# Tokens come from the credentials Secret; only the pull policy lives here.
# Left UNSET (not ""): per the vendor-confirmed note below, a "" value reaches
# the agent as present-but-empty and is sent as empty credentials on every
# pull — which registries reject (Docker Hub returns 401 "incorrect username
# or password"), breaking anonymous and per-pod-secret pulls alike.
#AGENT_PULL_NATS_USER=""
#AGENT_PULL_NATS_TOKEN=""
# Customer images are pulled from external registries (e.g. private
# Docker Hub) using per-pod image pull secrets, so the vendor registry
# whitelist and Harbor token are disabled. IMPORTANT: the launcher
# sources this file with `set -a`, so a variable set to "" reaches the
# agent as present-but-empty while a commented-out variable is unset —
# and the agent only fully disables its pull-rule checks when BOTH are
# unset (vendor-confirmed behavior). To re-enable the whitelist,
# uncomment both and list the allowed repo namespaces (comma-separated,
# e.g. "official,<dockerhub-namespace>").
#AGENT_PULL_HARBOR_TOKEN=""
#AGENT_PULL_INCLUDE="official"
AGENT_PULL_IGNORE=""
# Never satisfy an authorization with credentials stored in users.json: an
# instance is authorized by its own image pull secret or not at all.
AGENT_IMAGES_USERDB_AUTH_DISABLE="true"
AGENT_OTEL_ADDR=""
AGENT_OTEL_TOKEN=""
AGENT_LICENSE_CHECK_INTERVAL="4h"
AGENT_LICENSE_RENEWAL_BUFFER="12h"

## Node quota computation (read by the seed-users initContainer in the
## ukp-runtime overlay; the launchers ignore these). The seeded platform
## user's vmm/vmdb quotas — which are exactly the capacity kraftlet
## advertises for the node — are computed per node from host resources
## at seed time: the node's full resources minus a fixed system reserve.
##   vmm.max_vcpus      = host_cpus - UKP_QUOTA_CPU_RESERVE
##   vmm.max_memory_mb  = host_mem_mb - UKP_QUOTA_MEM_RESERVE_MB
##   vmdb.max_instances = UKP_QUOTA_MAX_INSTANCES (static ceiling)
## The reserve covers ukpd, the agent, and Talos system components.
## These quotas double as platform enforcement, so the reserve is what
## keeps guests from starving the host. If computation fails — or a
## reserve meets/exceeds what the node has — seeding FAILS the pod
## rather than assuming a capacity.
## These are defaults sized for bare-metal hosts; a per-node DaemonSet env
## var of the same name overrides the value here, so a small node can lower
## a reserve without editing this shared conf.
UKP_QUOTA_CPU_RESERVE="4"
UKP_QUOTA_MEM_RESERVE_MB="8192"
# Pods capacity: intentionally a high ceiling — CPU and memory (the vmm
# quotas) are the binding scheduling constraints. The vendor documents
# max_instances scaling to very large values (the practical bound is
# controller DB footprint).
UKP_QUOTA_MAX_INSTANCES="5000"
# Per-instance bounds (vmdb): the largest single microVM a user may create.
UKP_QUOTA_VM_MAX_MEM_MB="8192"
UKP_QUOTA_VM_MAX_VCPUS="8"

## Agent health + telemetry
# The agent exposes GET /v1/healthz (200 healthy / 500 degraded) for load
# balancers and monitoring. Disable its systemd service check: there is no
# systemd in the container, so that check would otherwise report the node
# degraded on a missing DBus. The image and subsystem checks stay active.
AGENT_HEALTH_SERVICE_SYSTEMD_ENABLE=0
# The agent embeds a Prometheus node_exporter (host CPU/memory/disk/network)
# and can ship ukpd API request/response logs to an OpenTelemetry collector.
# Provide the endpoint + tokens (AGENT_OTEL_ADDR / AGENT_OTEL_TOKEN above,
# AGENT_PROMETHEUS_BEARER_TOKEN) via the credentials Secret.

## Unused in the minimal profile (no proxy/certificate stack)
CLOUDFLARE_DNS_API_TOKEN=""
CLOUDFLARE_DNS_EMAIL=""
REMOTE_PSQLD=""
LOCAL_PSQLD=""
REMOTE_SMBD=""
LOCAL_SMBD=""

# Overlay credentials (and any per-node overrides) from the optional
# `ukp-runtime-credentials` Secret. Keys in that Secret use the same
# bash syntax as this file, e.g.:
#   AGENT_PULL_NATS_USER="..."
#   AGENT_PULL_NATS_TOKEN="..."
#   AGENT_PULL_HARBOR_TOKEN="..."
#   NODE_ACTIVATION_TOKEN="..."   # see docs/architecture/node-licensing.md
# NOTE: launchers source this file under `bash -e`; the `if` form keeps
# the final status 0 when the overlay is absent.
if [ -f /etc/ukp-secrets/ukp.secrets.conf ]; then
	. /etc/ukp-secrets/ukp.secrets.conf
fi
