apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: unikraft-instance-resource-rules
  labels:
    telemetry.miloapis.com/edge-hpa-resource-metrics: "true"
spec:
  groups:
    - name: unikraft-instance-resource.rules
      interval: 30s
      rules:
        - record: datum_compute_instance_cpu_usage_seconds_total
          expr: |
            label_replace(
              instance_cpu_time_s_total,
              "container_id", "$1",
              "instance_uuid", "(.*)"
            )
            * on(container_id) group_left(cluster, namespace, pod, container)
            max by (cluster, namespace, pod, container, container_id) (
              kube_pod_container_info{container_id!=""}
            )
            * on (namespace, pod) group_left(node) topk by (namespace, pod) (
              1, max by (namespace, pod, node) (kube_pod_info{node!=""})
            )
        - record: datum_compute_instance_memory_working_set_bytes
          expr: |
            label_replace(
              instance_rss_bytes,
              "container_id", "$1",
              "instance_uuid", "(.*)"
            )
            * on(container_id) group_left(cluster, namespace, pod, container)
            max by (cluster, namespace, pod, container, container_id) (
              kube_pod_container_info{container_id!=""}
            )
            * on (namespace, pod) group_left(node) topk by (namespace, pod) (
              1, max by (namespace, pod, node) (kube_pod_info{node!=""})
            )
