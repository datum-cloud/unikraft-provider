# Real-cluster only: the vendor ukp-remote-cni gRPC CNI shim (cnishim.cni.v1,
# :9555), as its own DaemonSet so its restarts don't couple to ukpd's (which
# parks every guest on restart). No published kraftlet has a client for it
# yet — this is prep, nothing calls it today.
#
# Overlay-only: without CNI_SHIM_TOKEN_FILE it crash-loops, and the kind e2e
# applies the base directly with no ESO to provide one.
#
# CNI bin/conf/cache dirs point at the shim's defaults (/opt/cni/bin,
# /etc/cni/net.d, /var/lib/cni) — the node's real CNI paths, shared
# intentionally so remote-cni integrates with the cluster's Multus CNI.
#
# Reaches multus-daemon's Unix socket at /run/multus/multus.sock: a fixed
# path and transport (no TCP option) that must match exactly, since it's
# shared with the node's real kubelet/containerd CNI calls.
#
# We reach it through a symlink, not a direct bind mount:
#   - Bind-mounting all of /run blocks kubelet from creating
#     /run/secrets/kubernetes.io/serviceaccount in this container, which
#     crash-loops every pod.
#   - Bind-mounting just the /run/multus leaf goes stale when
#     multus-daemon recreates that directory on restart.
# Mounting host /run read-only at /host/run, then symlinking
# /run/multus -> /host/run/multus in the entrypoint, avoids both: our own
# /run stays a normal tmpfs, and the symlink re-resolves on every open(),
# so it survives multus-daemon restarts without restarting this pod.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ukp-remote-cni
  namespace: unikraft-system
  labels:
    app.kubernetes.io/name: ukp-remote-cni
    app.kubernetes.io/component: cni-shim
    app.kubernetes.io/part-of: unikraft-provider
spec:
  selector:
    matchLabels:
      app: ukp-remote-cni
  template:
    metadata:
      labels:
        app: ukp-remote-cni
        app.kubernetes.io/name: ukp-remote-cni
        app.kubernetes.io/component: cni-shim
        app.kubernetes.io/part-of: unikraft-provider
    spec:
      hostNetwork: true
      dnsPolicy: Default
      priorityClassName: system-node-critical
      # Same node targeting as ukp-runtime: compute nodes only, not the
      # kraftlet virtual-kubelet node.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: compute.datumapis.com/runtime
                    operator: In
                    values: ["unikraft"]
                  - key: unikraft.com/virtual-kubelet
                    operator: DoesNotExist
      tolerations:
        - operator: Exists
      containers:
        - name: remote-cni
          image: ghcr.io/datum-cloud/ukp-runtime:latest
          imagePullPolicy: IfNotPresent
          # See the comment above on why we symlink /run/multus instead of
          # bind-mounting it directly.
          command:
            - sh
            - -c
            - |
              ln -sfn /host/run/multus /run/multus
              exec /usr/lib/ukp/remote-cni/bin/remote-cni run
          securityContext:
            privileged: true
          env:
            - name: CNI_SHIM_TOKEN_FILE
              value: /etc/ukp-remote-cni-secrets/token
            # multus-shim (exec'd as our child, so it inherits this) is a
            # CNI plugin itself and refuses to run if its own netns equals
            # CNI_NETNS. Because this pod is hostNetwork with no isolated
            # per-instance netns, that's always true here. Precautionary:
            # only affects this container. multus-daemon (a separate
            # process, invoked over the socket) doesn't read or forward
            # this to the delegate plugins it execs, so it has no effect
            # on delegate-level netns checks (e.g. cilium-cni's).
            - name: CNI_NETNS_OVERRIDE
              value: "true"
          volumeMounts:
            - name: cni-cache
              mountPath: /var/lib/cni
            - name: cni-bin
              mountPath: /opt/cni/bin
            - name: cni-conf
              mountPath: /etc/cni/net.d
            - name: host-run
              mountPath: /host/run
              readOnly: true
            - name: run-netns
              mountPath: /run/netns
              mountPropagation: Bidirectional
            - name: remote-cni-token
              mountPath: /etc/ukp-remote-cni-secrets
              readOnly: true
      volumes:
        # Persistent, not emptyDir: libcni caches Add results here for Del to
        # find later. Shared with the cluster's real CNI cache — different ID
        # space than pod sandbox IDs, so no collision.
        - name: cni-cache
          hostPath:
            path: /var/lib/cni
            type: DirectoryOrCreate
        # Node's real CNI plugin binaries (Multus, Cilium, etc.) — remote-cni execs these.
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        # Node's real CNI conflists (Multus, Cilium).
        - name: cni-conf
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        # Host /run, mounted at /host/run — see the comment above.
        - name: host-run
          hostPath:
            path: /run
            type: Directory
        # Node netns
        - name: run-netns
          hostPath:
            path: /run/netns
            type: DirectoryOrCreate
        - name: remote-cni-token
          secret:
            secretName: ukp-remote-cni-token
