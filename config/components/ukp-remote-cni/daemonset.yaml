# Real-cluster only: run the vendor ukp-remote-cni gRPC CNI shim
# (cnishim.cni.v1.CNI, :9555) as its own DaemonSet, not a container inside
# ukp-runtime's pod. No published kraftlet release has a client for this yet
# (0.6.0-staging.12 has none) — this wires the daemon up so it is ready for
# when one ships; nothing calls it today.
#
# Kept as its own DaemonSet rather than folded into ukp-runtime: bundling it
# into that pod would couple its restarts to ukpd's, and any future
# remote-cni-only change (new vendor version, a real conflist once the
# plugin-chain question below is answered) would then force ukpd/coredns/agent
# to restart too — which parks every running guest into standby first. This
# component has nothing to do with guest lifecycle, so it restarts on its own.
#
# Without CNI_SHIM_TOKEN_FILE the process crash-loops on start, so this
# DaemonSet only exists in the overlay where ESO can generate a token — the
# kind e2e applies the base directly and must not carry a component that is
# guaranteed to crash-loop there.
#
# The CNI plugin bin/conf/cache dirs are wired (hostPath, ready to receive
# real content) but deliberately left empty and deliberately NOT at the
# shim's default paths (/opt/cni/bin, /etc/cni/net.d, /var/lib/cni): on any
# real node those are the live paths the cluster's own CNI (Cilium/Multus)
# uses. Live-tested on us-central-1-lab: pointing the shim at the real paths
# made it discover and log the cluster's actual Cilium/Multus conflists, and
# it would default to invoking them on a call with no explicit config — never
# tested with an actual Add, but that's the cluster's pod network, not
# something a guest microVM's CNI call should ever touch. Isolated,
# ukp-remote-cni-only paths avoid that collision entirely. Which plugins the
# vendor's chain expects is still unresolved, and no one — including the
# vendor — currently runs this with a real plugin chain, so these stay empty.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ukp-remote-cni
  namespace: unikraft-system
  labels:
    app.kubernetes.io/name: ukp-remote-cni
    app.kubernetes.io/component: cni-shim
    app.kubernetes.io/part-of: unikraft-provider
spec:
  selector:
    matchLabels:
      app: ukp-remote-cni
  template:
    metadata:
      labels:
        app: ukp-remote-cni
        app.kubernetes.io/name: ukp-remote-cni
        app.kubernetes.io/component: cni-shim
        app.kubernetes.io/part-of: unikraft-provider
    spec:
      hostNetwork: true
      dnsPolicy: Default
      priorityClassName: system-node-critical
      # Same node targeting as ukp-runtime: only real compute nodes, never
      # the kraftlet virtual-kubelet node.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: compute.datumapis.com/runtime
                    operator: In
                    values: ["unikraft"]
                  - key: unikraft.com/virtual-kubelet
                    operator: DoesNotExist
      tolerations:
        - operator: Exists
      containers:
        - name: remote-cni
          image: ghcr.io/datum-cloud/ukp-runtime:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/lib/ukp/remote-cni/bin/remote-cni", "run"]
          securityContext:
            privileged: true
          env:
            - name: CNI_SHIM_TOKEN_FILE
              value: /etc/ukp-remote-cni-secrets/token
            - name: CNI_SHIM_CNI_CACHE_DIR
              value: /var/lib/ukp-remote-cni/cni-cache
            - name: CNI_SHIM_CNI_BIN_DIR
              value: /var/lib/ukp-remote-cni/cni-bin
            - name: CNI_SHIM_CNI_CONF_DIR
              value: /var/lib/ukp-remote-cni/cni-conf
          volumeMounts:
            - name: cni-cache
              mountPath: /var/lib/ukp-remote-cni/cni-cache
            - name: cni-bin
              mountPath: /var/lib/ukp-remote-cni/cni-bin
            - name: cni-conf
              mountPath: /var/lib/ukp-remote-cni/cni-conf
            - name: remote-cni-token
              mountPath: /etc/ukp-remote-cni-secrets
              readOnly: true
      volumes:
        # Persistent, not emptyDir: libcni persists Add-call state here so a
        # later Del finds it, including across pod restarts.
        - name: cni-cache
          hostPath:
            path: /var/lib/ukp-remote-cni/cni-cache
            type: DirectoryOrCreate
        # Empty: no CNI plugin binaries ship with the package or this repo.
        - name: cni-bin
          hostPath:
            path: /var/lib/ukp-remote-cni/cni-bin
            type: DirectoryOrCreate
        # Empty: no conflist ships with the package or this repo.
        - name: cni-conf
          hostPath:
            path: /var/lib/ukp-remote-cni/cni-conf
            type: DirectoryOrCreate
        - name: remote-cni-token
          secret:
            secretName: ukp-remote-cni-token
