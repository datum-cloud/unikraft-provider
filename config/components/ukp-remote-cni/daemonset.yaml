# Real-cluster only: run the vendor ukp-remote-cni gRPC CNI shim
# (cnishim.cni.v1.CNI, :9555) as its own DaemonSet, not a container inside
# ukp-runtime's pod. No published kraftlet release has a client for this yet
# (0.6.0-staging.12 has none) — this wires the daemon up so it is ready for
# when one ships; nothing calls it today.
#
# Kept as its own DaemonSet rather than folded into ukp-runtime: bundling it
# into that pod would couple its restarts to ukpd's, and any future
# remote-cni-only change (new vendor version, a real conflist once the
# plugin-chain question below is answered) would then force ukpd/coredns/agent
# to restart too — which parks every running guest into standby first. This
# component has nothing to do with guest lifecycle, so it restarts on its own.
#
# Without CNI_SHIM_TOKEN_FILE the process crash-loops on start, so this
# DaemonSet only exists in the overlay where ESO can generate a token — the
# kind e2e applies the base directly and must not carry a component that is
# guaranteed to crash-loop there.
#
# The CNI plugin bin/conf/cache dirs are mounted at the shim's default paths
# (/opt/cni/bin, /etc/cni/net.d, /var/lib/cni) — the same live paths the
# cluster's own CNI (Multus/Cilium) uses. That's intentional, not a leak:
# remote-cni is meant to integrate with the cluster's real Multus CNI rather
# than run a separate guest-only plugin chain. Live-tested on us-central-1-lab:
# the shim discovers and logs the existing Multus/Cilium conflists at start,
# which is the expected precondition for that integration.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ukp-remote-cni
  namespace: unikraft-system
  labels:
    app.kubernetes.io/name: ukp-remote-cni
    app.kubernetes.io/component: cni-shim
    app.kubernetes.io/part-of: unikraft-provider
spec:
  selector:
    matchLabels:
      app: ukp-remote-cni
  template:
    metadata:
      labels:
        app: ukp-remote-cni
        app.kubernetes.io/name: ukp-remote-cni
        app.kubernetes.io/component: cni-shim
        app.kubernetes.io/part-of: unikraft-provider
    spec:
      hostNetwork: true
      dnsPolicy: Default
      priorityClassName: system-node-critical
      # Same node targeting as ukp-runtime: only real compute nodes, never
      # the kraftlet virtual-kubelet node.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: compute.datumapis.com/runtime
                    operator: In
                    values: ["unikraft"]
                  - key: unikraft.com/virtual-kubelet
                    operator: DoesNotExist
      tolerations:
        - operator: Exists
      containers:
        - name: remote-cni
          image: ghcr.io/datum-cloud/ukp-runtime:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/lib/ukp/remote-cni/bin/remote-cni", "run"]
          securityContext:
            privileged: true
          env:
            - name: CNI_SHIM_TOKEN_FILE
              value: /etc/ukp-remote-cni-secrets/token
          volumeMounts:
            - name: cni-cache
              mountPath: /var/lib/cni
            - name: cni-bin
              mountPath: /opt/cni/bin
            - name: cni-conf
              mountPath: /etc/cni/net.d
            - name: remote-cni-token
              mountPath: /etc/ukp-remote-cni-secrets
              readOnly: true
      volumes:
        # Persistent, not emptyDir: libcni persists Add-call state here so a
        # later Del finds it, including across pod restarts. Shared with the
        # cluster's own CNI cache: libcni keys entries by network name +
        # container ID + interface, and guest IDs come from a different ID
        # space than pod sandbox IDs, so entries don't collide.
        - name: cni-cache
          hostPath:
            path: /var/lib/cni
            type: DirectoryOrCreate
        # The node's real CNI plugin binaries (Multus, Cilium, and the
        # standard plugins Multus may delegate to) — remote-cni execs these.
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        # The node's real CNI conflists (Multus, Cilium) — see comment above.
        - name: cni-conf
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: remote-cni-token
          secret:
            secretName: ukp-remote-cni-token
