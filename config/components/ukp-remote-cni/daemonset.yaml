# Real-cluster only: the vendor ukp-remote-cni gRPC CNI shim (cnishim.cni.v1,
# :9555), as its own DaemonSet so its restarts don't couple to ukpd's (which
# parks every guest on restart). No published kraftlet has a client for it
# yet — this is prep, nothing calls it today.
#
# Overlay-only: without CNI_SHIM_TOKEN_FILE it crash-loops, and the kind e2e
# applies the base directly with no ESO to provide one.
#
# CNI bin/conf/cache dirs point at the shim's defaults (/opt/cni/bin,
# /etc/cni/net.d, /var/lib/cni) — the node's real CNI paths, shared
# intentionally so remote-cni integrates with the cluster's Multus CNI.
#
# Also reaches multus's daemon socket: multus's thick-plugin design splits
# into the multus-shim binary (exec'd here as a CNI plugin per the CNI
# spec) and a separate multus-daemon process (kube-multus-ds) holding the
# real pod/NAD state. The shim hands off to the daemon over a Unix socket
# at /run/multus/multus.sock — hardcoded to that transport, no TCP option,
# and hardcoded to that exact path (it's what's baked into the multus CNI
# conf shared with the node's real kubelet/containerd CNI calls) — so the
# shim, running inside this container, must find the socket at literally
# /run/multus/multus.sock in its own mount namespace.
#
# We can't just bind-mount the host's /run/multus there directly (#88) or
# the whole host /run over our own /run (#89, reverted — see below), so
# instead: mount host /run read-only at /host/run (a path with no meaning
# to this container), then symlink /run/multus -> /host/run/multus in the
# entrypoint before exec'ing the real binary. This gets us both properties
# a bind mount alone can't:
#   - Our own /run stays the normal per-container tmpfs, so kubelet/
#     containerd can still create /run/secrets/kubernetes.io/serviceaccount
#     there to inject the pod's service-account-token volume. #89 replaced
#     our /run outright (read-only), which blocked that mkdir and put
#     every ukp-remote-cni pod into CrashLoopBackOff/RunContainerError.
#   - A symlink isn't a bind mount, so it doesn't pin to a directory's
#     inode at creation time — the kernel re-resolves it on every open().
#     multus-daemon removes and recreates its socket directory on every
#     restart; since /host/run is anchored at the host's real /run (which
#     multus-daemon never itself removes and recreates, only the "multus"
#     subdirectory beneath it), that recreation is always visible live
#     through our stable /host/run mount, with no restart of this pod
#     required (the original #88 bug this whole chain started from).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ukp-remote-cni
  namespace: unikraft-system
  labels:
    app.kubernetes.io/name: ukp-remote-cni
    app.kubernetes.io/component: cni-shim
    app.kubernetes.io/part-of: unikraft-provider
spec:
  selector:
    matchLabels:
      app: ukp-remote-cni
  template:
    metadata:
      labels:
        app: ukp-remote-cni
        app.kubernetes.io/name: ukp-remote-cni
        app.kubernetes.io/component: cni-shim
        app.kubernetes.io/part-of: unikraft-provider
    spec:
      hostNetwork: true
      dnsPolicy: Default
      priorityClassName: system-node-critical
      # Same node targeting as ukp-runtime: compute nodes only, not the
      # kraftlet virtual-kubelet node.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: compute.datumapis.com/runtime
                    operator: In
                    values: ["unikraft"]
                  - key: unikraft.com/virtual-kubelet
                    operator: DoesNotExist
      tolerations:
        - operator: Exists
      containers:
        - name: remote-cni
          image: ghcr.io/datum-cloud/ukp-runtime:latest
          imagePullPolicy: IfNotPresent
          # See the comment above on why this symlinks /run/multus into the
          # host-run mount rather than reaching it via a direct bind mount.
          command:
            - sh
            - -c
            - |
              ln -sfn /host/run/multus /run/multus
              exec /usr/lib/ukp/remote-cni/bin/remote-cni run
          securityContext:
            privileged: true
          env:
            - name: CNI_SHIM_TOKEN_FILE
              value: /etc/ukp-remote-cni-secrets/token
          volumeMounts:
            - name: cni-cache
              mountPath: /var/lib/cni
            - name: cni-bin
              mountPath: /opt/cni/bin
            - name: cni-conf
              mountPath: /etc/cni/net.d
            - name: host-run
              mountPath: /host/run
              readOnly: true
            - name: remote-cni-token
              mountPath: /etc/ukp-remote-cni-secrets
              readOnly: true
      volumes:
        # Persistent, not emptyDir: libcni caches Add results here for Del to
        # find later. Shared with the cluster's real CNI cache — different ID
        # space than pod sandbox IDs, so no collision.
        - name: cni-cache
          hostPath:
            path: /var/lib/cni
            type: DirectoryOrCreate
        # Node's real CNI plugin binaries (Multus, Cilium, etc.) — remote-cni execs these.
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        # Node's real CNI conflists (Multus, Cilium).
        - name: cni-conf
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        # Host /run, mounted at /host/run (not /run) — see the comment
        # above on why the exec'd multus-shim binary reaches it through a
        # symlink instead of a direct bind mount.
        - name: host-run
          hostPath:
            path: /run
            type: Directory
        - name: remote-cni-token
          secret:
            secretName: ukp-remote-cni-token
