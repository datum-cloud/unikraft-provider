# Optional: runs the vendor ukp-remote-cni gRPC CNI shim as its own DaemonSet,
# with an ESO-generated bearer token. Needs the External Secrets Operator, so
# add to a real-cluster overlay's `components:`; omit where ESO isn't present
# (e.g. the kind e2e overlay) — the shim crash-loops without a token.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - daemonset.yaml
  - token.yaml
