# The declared features are what this tier serves, not everything its runtime
# could support. The provider named below reports on the declaration through the
# Available condition, so a feature the provider cannot honor surfaces in the
# catalog instead of failing when an instance starts.
apiVersion: compute.datumapis.com/v1alpha
kind: RuntimeClass
metadata:
  name: unikernel
spec:
  controllerName: compute.datumapis.com/unikraft-provider
  displayName: Unikernel fast path
  description: >-
    Starts in a fraction of the time a container platform takes and carries very
    little per-instance overhead, in exchange for narrow image compatibility.
    Best for bursty, short-lived, purpose-built workloads.
  default: true
  isolation:
    boundary: unikernel
    description: >-
      Each instance runs as its own unikernel in its own virtual machine. There
      is no kernel shared with another tenant.
  capabilities:
    features:
      - sandboxRuntime
      - configMapVolumes
      - secretVolumes
      - imagePullSecrets
    compatibility: >-
      Runs images whose application binary is position-independent. The root
      filesystem is held in memory, so image size counts against the instance's
      memory and disk-backed volumes are not available. Images in a private
      registry are pulled with the credentials the instance names in its image
      pull secrets.
  lifecycle:
    typicalStartupTime: 7s
    description: >-
      A first start pulls the image and takes a few seconds. Once the image is
      present on the host, an instance boots in tens of milliseconds. The
      platform parks an idle instance into a snapshot and restores it on the
      next request, so an idle instance keeps its state without holding the
      host's memory. Suspend and resume run on the platform's own schedule and
      cannot be invoked directly.
