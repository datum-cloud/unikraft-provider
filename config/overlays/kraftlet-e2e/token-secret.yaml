# TEST/DEV ONLY — do NOT use in production.
#
# This is the well-known token for a freshly-seeded ukpd `ci` user
# (base64("ci$datum.users.kraftcloud:ci-e2e-token")). It authenticates only
# against a test runtime seeded with the matching users.json entry (see
# test/e2e/kind/setup.sh) and grants nothing on any real runtime, so it is
# non-sensitive. It exists so this directory is self-contained (kustomize
# build + the kind e2e work without an external secret backend).
#
# Real clusters get `kraftlet-ukc-token` from External Secrets Operator
# (gcp-secret-store) wired in datum-cloud/infra, which overrides this.
apiVersion: v1
kind: Secret
metadata:
  name: kraftlet-ukc-token
  namespace: kraftlet
  labels:
    app.kubernetes.io/name: kraftlet
    app.kubernetes.io/part-of: ukc
type: Opaque
stringData:
  token: "Y2kkZGF0dW0udXNlcnMua3JhZnRjbG91ZDpjaS1lMmUtdG9rZW4="
