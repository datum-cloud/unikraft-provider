# Test-infra overlay: Unikraft provider running in single-cell mode.
# Instance and Pod are co-located in the same cluster.
apiVersion: apiserver.config.datumapis.com/v1alpha1
kind: UnikraftProvider
metricsServer:
  bindAddress: ":8080"
  secureServing: false
downstreamResourceManagement:
  # NodeSelector and Tolerations are optional overrides. When unset the
  # provider defaults to: kubernetes.io/hostname=kraftlet and the
  # virtual-kubelet.io/provider=ukc:NoSchedule toleration.
  #
  # CNI is on by default, but this kind e2e environment doesn't deploy
  # ukp-remote-cni, so it's turned off here.
  enableCNI: false
