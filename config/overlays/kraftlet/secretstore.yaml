# ESO Kubernetes-provider store: lets the kraftlet namespace read the
# runtime-generated token Secret (ukp-auth-token) from ukp-system, so the token
# is GENERATED ONCE by the runtime overlay and only mirrored here — a single
# source of truth across the two namespaces. Cluster-scoped so the kraftlet-ns
# ExternalSecret can reference it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: k8s-ukp-system
spec:
  provider:
    kubernetes:
      remoteNamespace: ukp-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: ukp-system
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-kraftlet-token-reader
          namespace: ukp-system
