# Real-cluster overlay for the per-host kraftlet. It is the base as-is: the
# ukpd bearer Secret (kraftlet-ukc-token) is generated by the co-located
# ukp-runtime overlay (config/overlays/ukp-runtime) in this same
# unikraft-system namespace and read in-namespace by both ukpd (users.json) and
# this kraftlet DaemonSet (token) — a single source of truth, no cross-namespace
# mirror. Deployed by Flux after ukp-runtime; the kind e2e uses
# config/overlays/kraftlet-e2e instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../dependencies/kraftlet
patches:
  - path: cni-patch.yaml
    target:
      kind: DaemonSet
      name: kraftlet
