# Mirror the runtime-generated bearer token into the kraftlet namespace as
# kraftlet-ukc-token/token (the key the DaemonSet reads via KRAFTLET_UKC_TOKEN).
# The value is generated ONCE by the ukp-runtime overlay (ukp-system); this only
# copies it, so ukpd's stored credential and kraftlet's bearer are identical.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kraftlet-ukc-token
  namespace: kraftlet
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-ukp-system
  target:
    name: kraftlet-ukc-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: ukp-auth-token
        property: token
