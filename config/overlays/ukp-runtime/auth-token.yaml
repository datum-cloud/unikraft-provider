# Real-cluster ukpd credential: ONE ESO-generated password, rendered into both
# the ukpd user database (users.json, consumed by the seed-users initContainer)
# and the kraftlet bearer (the `token` key, read by the co-located kraftlet
# DaemonSet). Both consumers live in this namespace, so the generated
# kraftlet-ukc-token secret is a single in-namespace source of truth — no
# pre-provisioned per-cluster token and no cross-namespace mirror. This replaces
# the former GCP-backed `kraftlet-ukc-token` ExternalSecret.
#
# Needs the External Secrets Operator; it therefore lives in this overlay, never
# in the base (the kind e2e applies the base with no ESO installed).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ukp-auth-password
  namespace: unikraft-system
spec:
  length: 40
  digits: 10
  # No symbols: the value becomes the password half of base64("kraftlet:<pw>"),
  # and a ':' would break ukpd's user:password split.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kraftlet-ukc-token
  namespace: unikraft-system
spec:
  # Generate once and persist (ESO GeneratorState); do NOT rotate on a timer.
  # Rotation must be a deliberate op: ukpd only re-syncs users at boot and
  # kraftlet only re-reads the token at start, so both DaemonSets must restart.
  refreshInterval: "0"
  target:
    name: kraftlet-ukc-token
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # kraftlet bearer == ukpd auth_token == base64("kraftlet:<generated>").
        token: "{{ printf \"kraftlet:%s\" .password | b64enc }}"
        # ukpd users.json (consumed by the seed-users initContainer). It is the
        # vendor's default `root` user with the auth_token replaced and
        # permissions dropped to `developer`. This template owns IDENTITY and
        # PERMISSIONS only:
        #  - uuid/name are kept as the vendor seed. ukpd enforces user-name
        #    immutability on in-place update, so an already-seeded node (whose
        #    uuid holds name "root") can only have its token/permissions/quotas
        #    updated, not be renamed. Reusing this uuid makes the seed a clean
        #    in-place update on existing nodes and a clean first-seed on fresh
        #    ones.
        #  - permissions are `developer`, NOT `root`: root bypasses quota
        #    enforcement, so ukpd reports empty hard/limits for the user and
        #    kraftlet advertises a 0-capacity node. developer is sufficient for
        #    kraftlet's instance lifecycle.
        #  - vmdb/vmm quotas are deliberately ABSENT here: they are computed
        #    per node from host resources by the seed-users initContainer
        #    (knobs in config/dependencies/ukp-runtime/ukp.conf) and merged in
        #    before the file is installed. The quotas ARE the node capacity
        #    kraftlet advertises: cpu = vmm.max_vcpus,
        #    memory = vmm.max_memory_mb, pods = vmdb.max_instances.
        users.json: |
          [
            {
              "uuid": "3b2f013a-6c5e-4c6c-b993-60ed3b95b32c",
              "name": "root",
              "auth_token": "{{ printf "kraftlet:%s" .password | b64enc }}",
              "permissions": ["developer"],
              "network_id": 0
            }
          ]
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ukp-auth-password
