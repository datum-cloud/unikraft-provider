# Real-cluster overlay for the Unikraft runtime: the base DaemonSet plus the
# ESO-generated ukpd credential and the initContainer that seeds it. Deployed by
# Flux on real clusters (which have the External Secrets Operator). The kind e2e
# applies the base directly (config/dependencies/ukp-runtime), which has no ESO
# dependency. The generated token (kraftlet-ukc-token) is read in this same
# namespace by the co-located kraftlet DaemonSet (config/overlays/kraftlet).
#
# It also activates the node for licensing, using the activation secret from the
# cluster-provided `ukp-runtime-credentials` Secret (datum-cloud/infra wires
# that from GCP Secret Manager). Real clusters only, for the same reason: the
# kind e2e has no such secret and no route to the vendor control plane.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: unikraft-system
resources:
  - ../../dependencies/ukp-runtime
  - auth-token.yaml
patches:
  - path: seed-users-patch.yaml
    target:
      kind: DaemonSet
      name: ukp-runtime
  - path: net-iface-patch.yaml
    target:
      kind: DaemonSet
      name: ukp-runtime
  - path: activate-node-patch.yaml
    target:
      kind: DaemonSet
      name: ukp-runtime
# ukp-remote-cni: independent DaemonSet, see config/components/ukp-remote-cni.
components:
  - ../../components/ukp-remote-cni
# The initContainer scripts, injected as ConfigMaps (hash-suffixed: script
# changes roll the DaemonSet).
configMapGenerator:
  - name: ukp-seed-script
    files:
      - seed-users.sh
  - name: ukp-activate-script
    files:
      - activate-node.sh
