name: build

on:
  push:
  release:
    types: ["published"]

# The images built from this repository derive the same commit-pinned tag, so
# they and the bundle stay in lockstep. The runtime image is the exception: the
# config tree pins it by digest, for the reasons in
# config/dependencies/ukp-runtime/kustomization.yaml.

jobs:
  validate-kustomize:
    uses: datum-cloud/actions/.github/workflows/validate-kustomize.yaml@v1.21.0

  # Publishing the runtime image rolls the DaemonSet that owns every running
  # instance on a node, so build it only when its own build context moves.
  # Nothing else in this repository is a reason to restart the runtime.
  runtime-context-changed:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            runtime:
              - 'build/ukp-runtime/**'

  publish-container-image:
    needs:
      - validate-kustomize
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.21.0
    with:
      image-name: unikraft-provider
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  # The runtime image installs vendor packages and downloads the kernel, so both
  # credentials go in as build secrets. Quoting keeps the multi-line auth file intact.
  publish-runtime-image:
    needs:
      - validate-kustomize
      - runtime-context-changed
    if: needs.runtime-context-changed.outputs.changed == 'true'
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.21.0
    with:
      image-name: ukp-runtime
      context: build/ukp-runtime
      dockerfile-path: build/ukp-runtime/Dockerfile
      # amd64 only: the runtime's KVM guests are x86 and the vendor apt repo is amd64-only.
      platforms: linux/amd64
    secrets:
      build-secrets: |
        "unikraft-apt-auth=${{ secrets.UNIKRAFT_APT_AUTH }}"
        "unikraft-registry-auth=${{ secrets.UNIKRAFT_REGISTRY_AUTH }}"

  # The per-second billing state-projector: a small node sidecar in the
  # ukp-runtime DaemonSet that enriches the runtime lifecycle stream with project
  # attribution for the edge Vector agent.
  publish-state-projector-image:
    needs:
      - validate-kustomize
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.21.0
    with:
      image-name: ukp-state-projector
      context: .
      dockerfile-path: build/state-projector/Dockerfile
      platforms: linux/amd64
    secrets: inherit

  # Pin the images built from this repository to the tag their job published,
  # then push the config tree as the bundle. The runtime image is deliberately
  # absent: the config tree already carries its digest, so the bundle resolves
  # the same runtime whether or not this run rebuilt it, and a skipped runtime
  # build cannot leave the bundle pointing at a tag nobody published.
  publish-kustomize-bundle:
    needs:
      - publish-container-image
      - publish-state-projector-image
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.21.0
    with:
      bundle-name: ghcr.io/datum-cloud/unikraft-provider-kustomize
      bundle-path: config
      # The ukp-runtime overlay adds a seed-users container via a patch, so its
      # image can only be pinned by an images transformer that runs AFTER the
      # patch — i.e. one on the overlay itself, not the base. Stamp the overlay
      # with the same tag as the base so seed-users matches netsetup/ukpd/agent.
      images: |
        - { path: config/default, name: ghcr.io/datum-cloud/unikraft-provider, tag: "${{ needs.publish-container-image.outputs.tag }}" }
        - { path: config/dependencies/ukp-runtime, name: ghcr.io/datum-cloud/ukp-state-projector, tag: "${{ needs.publish-state-projector-image.outputs.tag }}" }
    secrets: inherit
