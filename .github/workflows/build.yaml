name: build

on:
  push:
  release:
    types: ["published"]

# Shared tag templates. docker/metadata-action derives the same version tag
# from the ref + commit date in every job, so the provider image, the runtime
# image, and the kustomize bundle all carry an identical, commit-pinned tag.
# Keep these in sync with datum-cloud/actions publish-docker.yaml.

jobs:
  validate-kustomize:
    uses: datum-cloud/actions/.github/workflows/validate-kustomize.yaml@v1.16.0

  publish-container-image:
    needs:
      - validate-kustomize
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.16.0
    with:
      image-name: unikraft-provider
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  # The runtime image installs the ukp packages from the vendor's
  # authenticated apt repository, which needs a BuildKit secret
  # (`--mount=type=secret,id=unikraft-apt-auth`). The shared publish-docker.yaml
  # forwards build-secrets straight to BuildKit, so the credentials never land
  # in an image layer or the image history. The secret is passed under this
  # job's `secrets:` block -- GitHub forbids the secrets context in a
  # reusable-workflow `with:` -- and the id=value entry is quoted because the
  # apt auth.conf is multi-line (machine/login/password) and build-push-action's
  # `secrets:` parser would otherwise split it on newlines and apt 401. Same
  # commit-pinned tag scheme (and `tag` output) as the provider image and bundle.
  publish-runtime-image:
    needs:
      - validate-kustomize
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@feat/publish-docker-build-secrets
    with:
      image-name: ukp-runtime
      context: build/ukp-runtime
      dockerfile-path: build/ukp-runtime/Dockerfile
      # amd64 only for now: KVM guests on this runtime are x86, and the vendor
      # apt repository is only validated for amd64. Revisit arm64 once there is
      # a runtime host target for it.
      platforms: linux/amd64
    secrets:
      build-secrets: |
        "unikraft-apt-auth=${{ secrets.UNIKRAFT_APT_AUTH }}"

  # Self-contained on purpose: the bundle must pin TWO differently-named
  # images (the provider image in config/default and the runtime image in
  # config/dependencies/ukp-runtime), but publish-kustomize-bundle.yaml@v1.16.0
  # only sets a single image-name. We stamp each overlay with the tag its image
  # job actually published (consumed from that job's `tag` output, so the bundle
  # can never drift from the images it references), then flux-push the config
  # tree under the same commit-pinned tag scheme.
  publish-kustomize-bundle:
    needs:
      - validate-kustomize
      - publish-container-image
      - publish-runtime-image
    permissions:
      id-token: write
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@v2.7.5

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/datum-cloud/unikraft-provider-kustomize
          tags: |
            type=ref,event=pr,suffix=-{{commit_date 'YYYYMMDD-HHmmss'}},prefix=v0.0.0-
            type=ref,event=pr,prefix=v0.0.0-
            type=ref,event=branch,suffix=-{{commit_date 'YYYYMMDD-HHmmss'}},prefix=v0.0.0-
            type=ref,event=branch,prefix=v0.0.0-
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha,prefix=v0.0.0-

      - name: Stamp image tags into overlays
        env:
          # Pin each overlay to exactly the tag its image job pushed. Both jobs
          # derive the tag from this same commit, so these match the bundle's
          # own commit-pinned tag below.
          PROVIDER_TAG: ${{ needs.publish-container-image.outputs.tag }}
          RUNTIME_TAG: ${{ needs.publish-runtime-image.outputs.tag }}
        run: |
          echo "Stamping provider image tag: ${PROVIDER_TAG}"
          echo "Stamping runtime image tag:  ${RUNTIME_TAG}"

          ( cd config/default \
            && kustomize edit set image \
                 "ghcr.io/datum-cloud/unikraft-provider=ghcr.io/datum-cloud/unikraft-provider:${PROVIDER_TAG}" )

          ( cd config/dependencies/ukp-runtime \
            && kustomize edit set image \
                 "ghcr.io/datum-cloud/ukp-runtime=ghcr.io/datum-cloud/ukp-runtime:${RUNTIME_TAG}" )

          echo "=== config/default/kustomization.yaml images ==="
          grep -A3 '^images:' config/default/kustomization.yaml || true
          echo "=== config/dependencies/ukp-runtime/kustomization.yaml images ==="
          grep -A3 '^images:' config/dependencies/ukp-runtime/kustomization.yaml || true

      - name: Publish bundle
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          REV="$(git rev-parse HEAD)"
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            tag_version="${tag#*:}"
            echo "Pushing oci://${tag}"
            flux push artifact "oci://${tag}" \
              --path="config" \
              --source="https://github.com/${GITHUB_REPOSITORY}" \
              --revision="${tag_version}@sha1:${REV}"
          done <<< "${TAGS}"
