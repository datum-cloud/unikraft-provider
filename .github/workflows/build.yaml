name: build

on:
  push:
  release:
    types: ["published"]

# All jobs derive the same commit-pinned tag, so the images and bundle stay in lockstep.

jobs:
  validate-kustomize:
    uses: datum-cloud/actions/.github/workflows/validate-kustomize.yaml@v1.20.0

  publish-container-image:
    needs:
      - validate-kustomize
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.20.0
    with:
      image-name: unikraft-provider
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  # The runtime image installs vendor packages and downloads the kernel, so both
  # credentials go in as build secrets. Quoting keeps the multi-line auth file intact.
  publish-runtime-image:
    needs:
      - validate-kustomize
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.20.0
    with:
      image-name: ukp-runtime
      context: build/ukp-runtime
      dockerfile-path: build/ukp-runtime/Dockerfile
      # amd64 only: the runtime's KVM guests are x86 and the vendor apt repo is amd64-only.
      platforms: linux/amd64
    secrets:
      build-secrets: |
        "unikraft-apt-auth=${{ secrets.UNIKRAFT_APT_AUTH }}"
        "unikraft-registry-auth=${{ secrets.UNIKRAFT_REGISTRY_AUTH }}"

  # Pin every image to the tag its job published, then push the config tree as the bundle.
  publish-kustomize-bundle:
    needs:
      - publish-container-image
      - publish-runtime-image
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.20.0
    with:
      bundle-name: ghcr.io/datum-cloud/unikraft-provider-kustomize
      bundle-path: config
      # The ukp-runtime overlay adds a seed-users container via a patch, so its
      # image can only be pinned by an images transformer that runs AFTER the
      # patch — i.e. one on the overlay itself, not the base. Stamp the overlay
      # with the same tag as the base so seed-users matches netsetup/ukpd/agent.
      images: |
        - { path: config/default, name: ghcr.io/datum-cloud/unikraft-provider, tag: "${{ needs.publish-container-image.outputs.tag }}" }
        - { path: config/dependencies/ukp-runtime, name: ghcr.io/datum-cloud/ukp-runtime, tag: "${{ needs.publish-runtime-image.outputs.tag }}" }
        - { path: config/overlays/ukp-runtime, name: ghcr.io/datum-cloud/ukp-runtime, tag: "${{ needs.publish-runtime-image.outputs.tag }}" }
    secrets: inherit
