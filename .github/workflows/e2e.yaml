name: e2e

# Full control-plane e2e in a single KVM-capable kind cluster: the compute
# control plane, the unikraft-provider, Kraftlet, and the containerized
# Unikraft runtime run together, and chainsaw drives a compute Instance all
# the way to a running microVM on the local runtime (test/e2e/kind/setup.sh,
# test/e2e/instance). The runtime is not tested in isolation.
#
# Secrets:
#   UNIKRAFT_APT_AUTH       apt auth.conf for pkg.unikraft.com (runtime image build)
#   UNIKRAFT_REGISTRY_AUTH  base64("user:password") for index.unikraft.io; the runtime
#                           image build pulls the platform kernel with it
#   UKP_AGENT_CREDENTIALS   ukp.secrets.conf; its vendor pull credentials let the
#                           runtime pull the test workload image

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# This workflow only reads the repository.
permissions:
  contents: read

# One run per ref; a newer push cancels an in-flight run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify KVM is available
        run: |
          test -e /dev/kvm
          grep -Eq '(vmx|svm)' /proc/cpuinfo

      - uses: ./.github/actions/setup-e2e-tools

      - name: Build runtime image (from the vendor apt repository)
        env:
          UNIKRAFT_APT_AUTH: ${{ secrets.UNIKRAFT_APT_AUTH }}
          UNIKRAFT_REGISTRY_AUTH: ${{ secrets.UNIKRAFT_REGISTRY_AUTH }}
        run: |
          umask 077
          auth="$(mktemp)"
          reg="$(mktemp)"
          printf '%s\n' "$UNIKRAFT_APT_AUTH" > "$auth"
          # No trailing newline: the value is base64 and is decoded verbatim.
          printf '%s' "$UNIKRAFT_REGISTRY_AUTH" > "$reg"
          docker build --secret id=unikraft-apt-auth,src="$auth" \
            --secret id=unikraft-registry-auth,src="$reg" \
            -t ukp-runtime:e2e build/ukp-runtime/
          rm -f "$auth" "$reg"

      - name: Build provider image
        run: docker build -t ghcr.io/datum-cloud/unikraft-provider:dev .

      - name: Bring up the single-cluster environment
        env:
          PROVIDER_IMAGE: ghcr.io/datum-cloud/unikraft-provider:dev
          RUNTIME_IMAGE: ukp-runtime:e2e
          UKP_AGENT_CREDENTIALS: ${{ secrets.UKP_AGENT_CREDENTIALS }}
        run: task e2e:up

      - name: Run chainsaw
        env:
          KUBECONFIG: /tmp/ukp-e2e.kubeconfig
        run: task e2e

      - name: Diagnostics
        if: failure()
        uses: ./.github/actions/e2e-diagnostics
