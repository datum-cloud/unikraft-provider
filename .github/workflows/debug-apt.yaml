name: debug-apt

# TEMPORARY. Dumps what each vendor feed carries and how the packages relate,
# so we can work out how to take only some components from staging. Delete once
# the staging pins are settled.

on:
  push:
    branches: [feat/kernel-less-images]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Register both vendor feeds
        env:
          UNIKRAFT_APT_AUTH: ${{ secrets.UNIKRAFT_APT_AUTH }}
        run: |
          sudo install -D -m 644 build/ukp-runtime/unikraft-cloud.gpg /usr/share/keyrings/unikraft-cloud.gpg
          sudo install -D -m 644 build/ukp-runtime/unikraft-cloud-staging.gpg /usr/share/keyrings/unikraft-cloud-staging.gpg
          sudo install -D -m 644 build/ukp-runtime/unikraft-cloud.sources /etc/apt/sources.list.d/unikraft-cloud.sources
          sudo install -D -m 644 build/ukp-runtime/unikraft-cloud-staging.sources /etc/apt/sources.list.d/unikraft-cloud-staging.sources
          umask 077
          echo "$UNIKRAFT_APT_AUTH" | sudo tee /etc/apt/auth.conf.d/unikraft.conf >/dev/null
          # Refresh everything. Later steps run apt-cache with the default
          # config, so the vendor feeds have to live where apt normally looks.
          sudo apt-get update

      - name: What does each feed carry?
        run: |
          echo "===== every ukp package, by feed ====="
          apt-cache search --names-only '^ukp' | sort | while read -r pkg _; do
            printf '%-24s' "$pkg"
            apt-cache madison "$pkg" | awk '{print $3, $6}' | tr '\n' ' ' | sed 's/  */ /g'
            echo
          done

      - name: How do the staging packages relate to the ukp12 set?
        run: |
          for p in ukp-platform ukp-agent ukp12-platform ukp12-agent ukp-coredns ukp12-coredns; do
            echo "===== $p ====="
            apt-cache show "$p" 2>/dev/null |
              grep -E '^(Package|Version|Depends|Pre-Depends|Provides|Conflicts|Replaces|Breaks):' |
              sed 's/^/  /'
            echo
          done

      - name: What pulls in ukp12-platform?
        run: |
          echo "===== reverse depends: ukp12-platform ====="
          apt-cache rdepends ukp12-platform
          echo "===== reverse depends: ukp12-agent ====="
          apt-cache rdepends ukp12-agent
