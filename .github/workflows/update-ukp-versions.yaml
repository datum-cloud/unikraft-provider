name: update-ukp-versions

# Checks the vendor's cloud/stable apt channel for newer ukp-* package
# versions than what build/ukp-runtime/Dockerfile pins, and ghcr.io for a
# newer kraftlet build, then opens one PR bumping whatever moved — so a
# single e2e run (see the close/reopen caveat below) covers the whole
# stack instead of one per dependency. Renovate can't do the apt side: the
# vendor's ProGet package-listing API 403s for our apt-only credential, so
# this queries the same apt metadata `apt-get` itself uses instead.
#
# Caveat: PRs opened with the default GITHUB_TOKEN don't trigger other
# `pull_request` workflows (GitHub's anti-recursion rule), so e2e won't
# auto-run on the bumped PR — close/reopen it (or push a commit) to kick
# off CI.
#
# Secrets:
#   UNIKRAFT_APT_AUTH   apt auth.conf for pkg.unikraft.com (same as e2e.yaml)
#   (kraftlet's ghcr.io package is public, no credential needed)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Register the vendor apt repositories
        env:
          UNIKRAFT_APT_AUTH: ${{ secrets.UNIKRAFT_APT_AUTH }}
        run: |
          sudo install -D -m 644 build/ukp-runtime/unikraft-cloud.gpg /usr/share/keyrings/unikraft-cloud.gpg
          sudo install -D -m 644 build/ukp-runtime/unikraft-cloud-staging.gpg /usr/share/keyrings/unikraft-cloud-staging.gpg
          sudo install -D -m 644 build/ukp-runtime/unikraft-cloud.sources /etc/apt/sources.list.d/unikraft-cloud.sources
          sudo install -D -m 644 build/ukp-runtime/unikraft-cloud-staging.sources /etc/apt/sources.list.d/unikraft-cloud-staging.sources
          umask 077
          echo "$UNIKRAFT_APT_AUTH" | sudo tee /etc/apt/auth.conf.d/unikraft.conf >/dev/null
          # Refresh everything. Later steps run apt-cache with the default
          # config, so the vendor feeds have to live where apt normally looks.
          sudo apt-get update

      - name: Check for newer ukp-* package versions
        run: |
          set -uo pipefail
          : > /tmp/ukp-bumps.txt
          dockerfile=build/ukp-runtime/Dockerfile
          while IFS='=' read -r arg_name current; do
            name="${arg_name%_VERSION}"
            name="${name#UKP_}"
            pkg="ukp-$(echo "$name" | tr '[:upper:]_' '[:lower:]-')"
            # Keep each package on the feed its current version came from.
            # Staging version numbers sort above stable, so an unfiltered
            # search would move every package to staging.
            case "$current" in
              *staging+deb*) channel=staging ;;
              *)             channel=stable ;;
            esac
            latest="$(apt-cache madison "$pkg" 2>/dev/null |
              awk -v c="trixie/$channel" 'index($0, c) {print $3; exit}')"
            if [ -z "$latest" ]; then
              echo "::warning::no $channel version found for $pkg (ARG $arg_name), skipping"
              continue
            fi
            if [ "$latest" != "$current" ]; then
              echo "$pkg [$channel]: $current -> $latest"
              sed -i "s|^ARG ${arg_name}=.*|ARG ${arg_name}=${latest}|" "$dockerfile"
              echo "- \`$pkg\` (\`$channel\`): \`$current\` → \`$latest\`" >> /tmp/ukp-bumps.txt
            fi
          done < <(grep -oP '^ARG \KUKP_\w+_VERSION=.*' "$dockerfile")

      - name: Check for a newer kraftlet image
        run: |
          set -uo pipefail
          daemonset=config/dependencies/kraftlet/daemonset.yaml
          current="$(grep -oP 'ghcr\.io/unikraft-cloud/kraftlet:\K\S+' "$daemonset")"
          if [ -z "$current" ]; then
            echo "::warning::couldn't find the current kraftlet tag in $daemonset, skipping"
            exit 0
          fi

          # Only released up to 0.2 (see the image comment in daemonset.yaml);
          # the -staging.N track is what's actually deployed.
          all_tags="$(skopeo list-tags docker://ghcr.io/unikraft-cloud/kraftlet | jq -r '.Tags[]')"
          staging_tags="$(echo "$all_tags" | grep -P '^[0-9]+\.[0-9]+\.[0-9]+-staging\.[0-9]+$')"
          latest="$(echo "$staging_tags" | sort -V | tail -1)"

          if [ -z "$latest" ]; then
            echo "::warning::no kraftlet staging tag found, skipping"
            exit 0
          fi
          if [ "$latest" != "$current" ]; then
            echo "kraftlet: $current -> $latest"
            sed -i "s|ghcr\.io/unikraft-cloud/kraftlet:${current}|ghcr.io/unikraft-cloud/kraftlet:${latest}|" "$daemonset"
            echo "- \`kraftlet\`: \`$current\` → \`$latest\`" >> /tmp/ukp-bumps.txt
          fi

      - name: Compose pull request body
        run: |
          set -uo pipefail
          if [ -s /tmp/ukp-bumps.txt ]; then
            { printf 'Vendor released newer versions of the following:\n\n'
              cat /tmp/ukp-bumps.txt
            } > /tmp/ukp-bump-body.md
          else
            echo "All ukp-runtime dependencies are up to date."
            printf 'All ukp-runtime dependencies are already up to date.\n' > /tmp/ukp-bump-body.md
          fi
          cat /tmp/ukp-bump-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            build/ukp-runtime/Dockerfile
            config/dependencies/kraftlet/daemonset.yaml
          commit-message: "build(runtime): bump ukp-runtime dependencies"
          title: "build(runtime): bump ukp-runtime dependencies"
          body-path: /tmp/ukp-bump-body.md
          branch: chore/bump-ukp-versions
          delete-branch: true
          labels: dependencies
