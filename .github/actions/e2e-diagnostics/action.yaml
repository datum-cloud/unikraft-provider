name: e2e diagnostics
description: Dump cluster and runtime state for debugging a failed e2e run.

inputs:
  kubeconfig:
    description: Path to the kubeconfig for the e2e cluster
    default: /tmp/ukp-e2e.kubeconfig

runs:
  using: composite
  steps:
    - shell: bash
      env:
        KUBECONFIG: ${{ inputs.kubeconfig }}
      run: |
        kubectl get nodes -o wide || true
        kubectl -n ukp-system get pods -o wide || true
        kubectl -n ukp-system logs -l app=ukp-runtime -c ukpd --tail=50 || true
        # ukpd logs the microVM lifecycle to a file, not stdout — dump it to
        # see whether an instance actually booted (VMM start, or a failure).
        POD=$(kubectl -n ukp-system get pod -l app=ukp-runtime --field-selector status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        echo "=== ukpd.log (microVM lifecycle) ==="
        kubectl -n ukp-system exec "$POD" -c ukpd -- tail -100 /var/log/ukp/platform/ukpd.log 2>/dev/null || true
        echo "=== compute Instances ==="
        kubectl get instances.compute.datumapis.com -A -o wide || true
        kubectl -n kraftlet logs -l app.kubernetes.io/name=kraftlet --tail=30 || true
        kubectl -n infra-provider-unikraft-system logs -l control-plane=controller-manager --tail=30 || true
