name: e2e diagnostics
description: Dump cluster and runtime state for debugging a failed e2e run.

inputs:
  kubeconfig:
    description: Path to the kubeconfig for the e2e cluster
    default: /tmp/ukp-e2e.kubeconfig

runs:
  using: composite
  steps:
    - shell: bash
      env:
        KUBECONFIG: ${{ inputs.kubeconfig }}
      run: |
        # Never abort mid-dump; best-effort diagnostics only.
        set +e
        echo "=== nodes ==="
        kubectl get nodes -o wide
        echo "=== pods (all namespaces) ==="
        kubectl get pods -A -o wide
        # The whole runtime stack (ukp-runtime + kraftlet) lives in unikraft-system.
        echo "=== ukpd container logs ==="
        kubectl -n unikraft-system logs -l app=ukp-runtime -c ukpd --tail=50
        # ukpd logs the microVM lifecycle to a file, not stdout — dump it to
        # see whether an instance actually booted (VMM start, or a failure).
        POD=$(kubectl -n unikraft-system get pod -l app=ukp-runtime --field-selector status.phase=Running -o jsonpath='{.items[0].metadata.name}')
        echo "=== ukpd.log (microVM lifecycle) ==="
        [ -n "$POD" ] && kubectl -n unikraft-system exec "$POD" -c ukpd -- tail -100 /var/log/ukp/platform/ukpd.log
        echo "=== kraftlet logs ==="
        kubectl -n unikraft-system logs -l app.kubernetes.io/name=kraftlet --tail=50
        echo "=== provider logs ==="
        for ns in unikraft-system infra-provider-unikraft-system; do
          kubectl -n "$ns" logs -l control-plane=controller-manager --tail=50 2>/dev/null
        done
        # state-projector logs every stage (boot, podwatch, event, window,
        # resolve, record) plus a "stats" heartbeat — this is the only place
        # that shows whether billing data was actually produced, since chainsaw
        # never asserts on it.
        echo "=== state-projector container logs ==="
        kubectl -n unikraft-system logs -l app=ukp-runtime -c state-projector --tail=200
        echo "=== vm-state.usage (windowed billing records state-projector wrote) ==="
        [ -n "$POD" ] && kubectl -n unikraft-system exec "$POD" -c state-projector -- cat /var/run/ukp/vm-state.usage 2>&1
        echo "=== compute Instances ==="
        kubectl get instances.compute.datumapis.com -A -o wide
        echo "=== microVM pods (managed-by infra-provider-unikraft) + events ==="
        kubectl get pods -A -l managed-by=infra-provider-unikraft -o wide
        kubectl get events -A --sort-by=.lastTimestamp | tail -40
        true
