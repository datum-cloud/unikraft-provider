version: '3'

dotenv: ['.env']

vars:
  IMG_NAME: 'ghcr.io/datum-cloud/unikraft-provider'
  IMG_TAG: 'dev'
  IMG: '{{.IMG_NAME}}:{{.IMG_TAG}}'
  # The single-cluster e2e kind cluster (created by test/e2e/kind/setup.sh).
  E2E_CLUSTER: 'ukp-e2e'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  dev:build:
    desc: Build the unikraft-provider container image
    silent: true
    cmds:
      - docker build -t {{.IMG}} .

  e2e:up:
    desc: >
      Bring up the full single-cluster e2e environment — kind + the containerized
      Unikraft runtime + kraftlet + the provider. Expects the RUNTIME_IMAGE,
      PROVIDER_IMAGE and UKP_AGENT_CREDENTIALS env vars (see test/e2e/kind/setup.sh).
    silent: true
    cmds:
      - bash test/e2e/kind/setup.sh

  e2e:
    desc: Run the chainsaw e2e tests (bring the environment up first with `task e2e:up`)
    silent: true
    cmds:
      - chainsaw test test/e2e --config test/e2e/.chainsaw.yaml

  e2e:down:
    desc: Tear down the e2e kind cluster
    silent: true
    cmds:
      - kind delete cluster --name {{.E2E_CLUSTER}}
